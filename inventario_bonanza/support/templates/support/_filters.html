<form method="get" class="card card-body mb-3">
{% if team %}<input type="hidden" name="team" value="1">{% endif %}
{{ filters.non_field_errors }}
<div class="row g-3 align-items-end">{% for field in filters %}<div class="col-sm-6 col-xl-3">{% if field.field.widget.input_type == 'checkbox' %}<div class="form-check">{{ field }} <label for="{{ field.id_for_label }}">{{ field.label }}</label></div>{% else %}<label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% endif %}{{ field.errors }}</div>{% endfor %}<div class="col-sm-6 col-xl-3"><button class="btn btn-primary" type="submit">Aplicar filtros</button></div></div>
</form>
