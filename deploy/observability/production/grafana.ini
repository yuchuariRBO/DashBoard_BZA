[server]
http_addr = 127.0.0.1
http_port = 13000
root_url = https://bonanza.robio-ai.com/grafana/
serve_from_sub_path = true
[paths]
data = /var/lib/bonanza-observability/grafana
logs = /var/log/bonanza-observability/grafana
plugins = /var/lib/bonanza-observability/grafana/plugins
provisioning = /etc/bonanza-observability/provisioning
[auth.anonymous]
enabled = false
[auth.basic]
enabled = false
[auth]
disable_login_form = true
disable_signout_menu = true
[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
sync_ttl = 0
whitelist = 127.0.0.1
headers = Role:X-WEBAUTH-ROLE
enable_login_token = false
[users]
allow_sign_up = false
auto_assign_org_role = Viewer
[security]
admin_user = internal-bootstrap-admin
admin_password = $__file{/etc/bonanza-observability/grafana-admin-password}
allow_embedding = false
cookie_secure = true
cookie_samesite = lax
[analytics]
reporting_enabled = false
check_for_updates = false
[plugins]
preinstall_disabled = true
[log]
mode = console
