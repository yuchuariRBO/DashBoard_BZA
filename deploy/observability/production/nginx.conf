# Include inside the HTTPS server only. Grafana is never reachable anonymously.
location = /observabilidad/metricas/ {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host bonanza.robio-ai.com;
    proxy_set_header X-Forwarded-Proto https;
}
location = /observabilidad/grafana/acceso/ { return 404; }
location = /_bonanza_grafana_auth {
    internal;
    proxy_pass http://127.0.0.1:8000/observabilidad/grafana/acceso/;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host bonanza.robio-ai.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
}
location = /grafana { return 302 /grafana/; }
location /grafana/ {
    auth_request /_bonanza_grafana_auth;
    auth_request_set $grafana_identity $upstream_http_x_grafana_user;
    auth_request_set $grafana_role $upstream_http_x_grafana_role;
    error_page 401 = /login/?next=/grafana/;
    proxy_pass http://127.0.0.1:13000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-WEBAUTH-USER $grafana_identity;
    proxy_set_header X-WEBAUTH-ROLE $grafana_role;
    proxy_set_header Authorization "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
