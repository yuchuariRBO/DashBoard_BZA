[Service]
Environment=PROMETHEUS_MULTIPROC_DIR=/run/bonanza-metrics
ExecStartPre=/root/bonanza/venv/bin/python /root/bonanza/deploy/observability/reset_multiprocess.py
ExecStart=
ExecStart=/root/bonanza/venv/bin/gunicorn --workers 3 --bind 127.0.0.1:8000 --access-logfile /root/bonanza/logs/gunicorn/access.log --error-logfile /root/bonanza/logs/gunicorn/error.log --capture-output --config /root/bonanza/deploy/observability/gunicorn.conf.py inventario_bonanza.wsgi:application
