global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: ['/etc/prometheus/alerts.yml']
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:19093']
scrape_configs:
  - job_name: bonanza
    metrics_path: /observabilidad/metricas/
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ['127.0.0.1:18000']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:19090']
  # Requires the optional host-metrics profile on a development/test host.
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:19100']
